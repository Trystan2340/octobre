<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Associer mon téléphone · OCTOBRE</title>
  <link rel="stylesheet" href="interface/style.css">
  <link rel="stylesheet" href="interface/identity.css">
  <link rel="stylesheet" href="interface/redesign.css">
  <link rel="stylesheet" href="interface/theme.css">
  <script src="apercu-donnees.js" defer></script>
  <script src="interface/pair.js" defer></script>
</head>
<body class="pair-body">
  <main class="pair-shell">
    <aside class="pair-aside">
      <div class="pair-logo"><span class="brand-mark" aria-hidden="true"><span class="mark-core">✳</span></span> OCTOBRE</div>
      <div class="pair-art" aria-hidden="true"><div class="pair-orb"></div></div>
      <p>Votre assistant, maintenant à portée de main.<br>Connexion depuis votre réseau local.</p>
    </aside>
    <section class="pair-form" aria-labelledby="pair-title">
      <div class="pair-kicker">FREEV LOCAL / CONNEXION</div>
      <h1 id="pair-title">Connectez votre<br>téléphone.</h1>
      <p class="muted">Renseignez le code à six chiffres affiché sur votre PC. Il est valable pendant deux minutes.</p>
      <label for="device-name">Nom de votre appareil<input id="device-name" name="device-name" autocomplete="nickname" value="Mon téléphone"></label>
      <label for="pair-code">Code d'association<input id="pair-code" name="pair-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="000 000"></label>
      <button id="pair-button" class="primary">Associer cet appareil <span class="send-arrow btn-icon icon-arrow" aria-hidden="true"></span></button>
      <p id="pair-result" role="alert" aria-live="polite"></p>
    </section>
  </main>
</body>
</html>
